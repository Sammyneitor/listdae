<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>SGU-INICIO DE SESION</title>
      <link rel="icon" href="img/logo.png" type="image/x-icon">
      <script src="https://kit.fontawesome.com/c4cf362cd6.js" crossorigin="anonymous"></script>
      <link rel="stylesheet" href="styleGlobal.css">
      <script src="login.js" defer></script>
   </head>
   <body id="bodyLOG">
      <div id="loading-container" style="display: none;">
         <div id="spinner"></div>
      </div>
      <header>
         <div id="formLogSis">
            <div id="MediaFondo">
               <video autoplay muted loop class="video-fondo">
                  <source src="img/video.mp4" type="video/mp4">
                  Tu navegador no soporta el video.
               </video>
            </div>
            <img src="img/logo.png" class="LogoLoging" alt="Logo SGU"/>
            <a href="http://www.fcs.uc.edu.ve/" target="_blank" title="Visitar www.fcs.uc.edu.ve">
               <!-- Cambia la URL por la que deseas -->
               <img src="img/logoFCS.png" class="LogoFCS" alt="Logo FCS"/>
            </a>
            <a href="http://www.uc.edu.ve/" target="_blank">
               <!-- Cambia la URL por la que desees -->
               <img src="img/logoUC.png" class="LogoUC" alt="Logo UC"/>
            </a>
            <a href="http://www.facyt.uc.edu.ve/" target="_blank">
               <!-- Cambia la URL por la que desees -->
               <img src="img/logoFACYT.png" class="LogoFACYT" alt="Logo FACYT"/>
            </a>
            <span>"La educación no es una preparación <br> para la vida. La educación es la vida misma"</span>
            <div id="formularioLoging">
               <form id="loginForm">
                  <label for="username">Bienvenido de nuevo</label><br>
                  <h1>Inicio de Sesión</h1>
                  <label for="username">Nombre de usuario</label><br>
                  <input type="text" id="username" name="username" required><br><br>
                  <i class="fa-solid fa-user"></i>
                  <label for="password">Contraseña</label><br>
                  <input type="password" id="password" name="password" required><br><br>
                  <i class="fa-solid fa-lock"></i>
                  <button type="button" id="Btn-Log">Iniciar Sesión</button>
                  <!-- <a href="#">Crear Acceso</a> -->
                  <!-- <a href="#">Recuperar Usuario/Contraseña</a> -->
               </form>
               <div id="error-message"></div>
            </div>
         </div>
      </header>
   </body>
</html>
